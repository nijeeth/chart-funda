<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
  </defs>

  <!-- Background badge -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#33415c" stroke-width="1.5"/>

  <!-- EMA support line -->
  <path d="M18 92 C 34 90, 46 86, 56 78 C 66 70, 70 60, 78 50 C 86 40, 96 34, 110 28"
        fill="none" stroke="#6f9bff" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Two tight red consolidation candles -->
  <line x1="34" y1="58" x2="34" y2="70" stroke="#f23645" stroke-width="2.5"/>
  <rect x="28" y="60" width="12" height="16" rx="1.5" fill="#f23645"/>
  <line x1="52" y1="64" x2="52" y2="78" stroke="#f23645" stroke-width="2.5"/>
  <rect x="46" y="66" width="12" height="14" rx="1.5" fill="#f23645"/>

  <!-- Two green breakout candles -->
  <line x1="70" y1="34" x2="70" y2="82" stroke="#26a69a" stroke-width="3"/>
  <rect x="63" y="40" width="14" height="36" rx="2" fill="#26a69a"/>
  <line x1="91" y1="20" x2="91" y2="70" stroke="#26a69a" stroke-width="3"/>
  <rect x="84" y="26" width="14" height="38" rx="2" fill="#26a69a"/>
</svg>